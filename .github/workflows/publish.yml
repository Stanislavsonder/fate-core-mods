name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'blocklist.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install repo tooling dependencies
        run: pnpm install --frozen-lockfile

      # Same folder-detection logic as validate-pr.yml, but against the push
      # diff (github.event.before -> github.sha) instead of a PR diff, and
      # against *every* changed mod folder — a push can legitimately touch
      # more than one (see 809f046, which published dice-d6 and silently
      # skipped example under the old head -n1 logic).
      - name: Detect changed mods / blocklist-only
        id: detect
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "$CHANGED"
          # Trailing slash is required: mods/<id>/... is a mod folder, but a
          # file directly under mods/ (e.g. mods/README.md) is not.
          MOD_DIRS=$(echo "$CHANGED" | grep -oE '^mods/[^/]+/' | sed 's:/$::' | sort -u)
          if [ -n "$MOD_DIRS" ]; then
            {
              echo "mod-dirs<<PUBLISH_MOD_DIRS_EOF"
              echo "$MOD_DIRS"
              echo "PUBLISH_MOD_DIRS_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "mod-dirs-csv=$(echo "$MOD_DIRS" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -q '^blocklist.json$'; then
            echo "blocklist-only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mod dependencies
        if: steps.detect.outputs.mod-dirs
        run: |
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            (cd "$dir" && pnpm install --frozen-lockfile)
          done <<< "${{ steps.detect.outputs.mod-dirs }}"

      - name: Build mod
        if: steps.detect.outputs.mod-dirs
        run: |
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            (cd "$dir" && pnpm run build)
          done <<< "${{ steps.detect.outputs.mod-dirs }}"

      - name: Checkout gh-pages
        if: steps.detect.outputs.mod-dirs || steps.detect.outputs.blocklist-only == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
        continue-on-error: true # first-ever publish: the branch doesn't exist yet

      - name: Ensure gh-pages branch exists locally
        if: steps.detect.outputs.mod-dirs || steps.detect.outputs.blocklist-only == 'true'
        working-directory: gh-pages
        run: |
          git config user.name "fate-mods-bot"
          git config user.email "actions@github.com"
          # A *failed* checkout of a not-yet-existing "gh-pages" ref still
          # leaves behind a git-initialized directory on the runner's default
          # branch name (observed: "master", not "gh-pages") with zero
          # commits — checking `[ -d gh-pages/.git ]` alone can't tell that
          # apart from a real prior publish, and skips re-creating the
          # correctly-named branch. Renaming whatever branch we're currently
          # on works whether it's a real fetched "gh-pages" (no-op rename) or
          # the failed-checkout's stray default branch (even with zero
          # commits — `git branch -m` works on an unborn branch too).
          current_branch=$(git symbolic-ref --short -q HEAD || echo "")
          if [ "$current_branch" != "gh-pages" ]; then
            git branch -m gh-pages
          fi
          if [ ! -f registry.json ]; then
            echo '{"schemaVersion":1,"generatedAt":"","blocklist":{},"mods":[]}' > registry.json
            git add registry.json
            git commit -m "chore: initialize gh-pages"
          fi
          if [ ! -f .nojekyll ]; then
            # GitHub Pages runs Jekyll by default, which ignores
            # underscore-prefixed paths and can otherwise mangle a plain
            # static-file site — .nojekyll disables that processing entirely.
            # Checked independent of registry.json's existence so it still
            # gets added to a gh-pages branch that already has content but
            # predates this fix.
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: add .nojekyll"
          fi

      - name: Publish mod
        if: steps.detect.outputs.mod-dirs
        run: |
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            pnpm ci:publish "$dir" gh-pages
          done <<< "${{ steps.detect.outputs.mod-dirs }}"

      - name: Publish blocklist-only update
        if: steps.detect.outputs.blocklist-only == 'true'
        run: pnpm ci:publish --blocklist-only gh-pages

      - name: Commit and push gh-pages
        if: steps.detect.outputs.mod-dirs || steps.detect.outputs.blocklist-only == 'true'
        working-directory: gh-pages
        run: |
          git config user.name "fate-mods-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "publish: ${{ steps.detect.outputs.mod-dirs-csv || 'blocklist update' }} (${{ github.sha }})"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin gh-pages
          fi
